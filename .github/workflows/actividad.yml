name: Actualizar actividad del perfil

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actividad-perfil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.repository == 'gpazop/gpazop' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Renderizar calendario público
        run: python3 scripts/render.py --activity-only
      - name: Guardar cambios
        run: |
          git add cards/actividad.svg cards/contribuciones.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza la actividad pública del perfil"
          git push origin HEAD
